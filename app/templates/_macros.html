{% macro cell(value) -%}
  {%- if value is none -%}<span class="null">NULL</span>{%- else -%}{{ value|show }}{%- endif -%}
{%- endmacro %}

{% macro result_table(columns, rows) -%}
<div class="table-wrap">
<table class="data">
  <thead><tr>{% for c in columns %}<th>{{ c }}</th>{% endfor %}</tr></thead>
  <tbody>
  {% for row in rows %}
    <tr>{% for v in row %}<td>{{ cell(v) }}</td>{% endfor %}</tr>
  {% endfor %}
  </tbody>
</table>
</div>
{%- endmacro %}
